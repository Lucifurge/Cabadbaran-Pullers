<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabadbaran Pullers Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="overlay">
<div class="card">
<img src="logo.png" class="logo">
<h1>Cabadbaran Pullers</h1>
<p>Arm Wrestling Registration</p>
<form id="regForm">
<input name="fullname" placeholder="Full Name" required>
<input name="age" type="number" placeholder="Age" required>
<select name="gender"><option>Male</option><option>Female</option></select>
<input name="weight" type="number" placeholder="Weight (kg)" required>
<input name="contact" placeholder="Contact Number" required>
<input name="facebook" placeholder="Facebook Profile">
<button>Register</button>
</form>
<div id="msg"></div>
</div></div>
<script src="script.js"></script>
</body></html>
