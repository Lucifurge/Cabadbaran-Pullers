<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Cabadbaran Pullers</title>

    <link rel="icon" href="images/logo.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/6b5b7f1f89.js" crossorigin="anonymous"></script>
</head>

<body>

<header class="register-header">

    <a href="index.html" class="logo">
        <img src="images/logo.png" alt="">
        <span>Cabadbaran Pullers</span>
    </a>

    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        Back Home
    </a>

</header>

<section class="register-wrapper">

<div class="register-card">

<h1>Membership Registration</h1>

<p>
Become an official member of Cabadbaran Pullers.
Fill out all required information to complete your application.
</p>

<!-- Progress -->

<div class="progress">

<div class="step active">
<span>1</span>
<p>Personal</p>
</div>

<div class="line"></div>

<div class="step">
<span>2</span>
<p>Emergency</p>
</div>

<div class="line"></div>

<div class="step">
<span>3</span>
<p>Arm Wrestling</p>
</div>

<div class="line"></div>

<div class="step">
<span>4</span>
<p>Membership</p>
</div>

<div class="line"></div>

<div class="step">
<span>5</span>
<p>Finish</p>
</div>

</div>

<form id="registrationForm">

<!-- STEP 1 -->

<div class="form-step active">

<h2>
<i class="fas fa-user"></i>
Personal Information
</h2>

<div class="profile-upload">

<img src="images/default-avatar.png"
id="previewImage">

<label for="profilePicture">
<i class="fas fa-camera"></i>
Upload Profile Picture
</label>

<input
type="file"
id="profilePicture"
accept="image/*"
hidden>

</div>

<div class="grid-2">

<div class="input-group">
<label>First Name *</label>
<input
type="text"
required
placeholder="Juan">
</div>

<div class="input-group">
<label>Middle Name</label>
<input
type="text"
placeholder="Santos">
</div>

<div class="input-group">
<label>Last Name *</label>
<input
type="text"
required
placeholder="Dela Cruz">
</div>

<div class="input-group">
<label>Birth Date *</label>
<input
type="date"
id="birthday"
required>
</div>

<div class="input-group">
<label>Age</label>
<input
type="number"
id="age"
readonly>
</div>

<div class="input-group">
<label>Gender *</label>

<select required>

<option value="">
Select Gender
</option>

<option>Male</option>

<option>Female</option>

</select>

</div>

<div class="input-group">

<label>Email Address *</label>

<input
type="email"
required
placeholder="example@email.com">

</div>

<div class="input-group">

<label>Mobile Number *</label>

<input
type="tel"
required
placeholder="09XXXXXXXXX">

</div>

</div>

<div class="input-group">

<label>Facebook Profile Link</label>

<input
type="url"
placeholder="https://facebook.com/...">

</div>

<div class="input-group">

<label>Complete Address *</label>

<textarea
rows="4"
required
placeholder="House No., Street, Barangay, City, Province"></textarea>

</div>

<div class="button-group">

<button
type="button"
class="next-btn">

Next
<i class="fas fa-arrow-right"></i>

</button>

</div>

</div>

<!-- STEP 2 HERE -->

</form>

</div>

</section>

<script src="register.js"></script>

</body>
</html>
