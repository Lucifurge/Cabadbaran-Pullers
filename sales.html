<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Cabadbaran Pullers Sales Dashboard
</title>


<link rel="icon" href="logo.png">


<link rel="stylesheet" href="sales.css">


<link 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">


</head>


<body>


<header class="sales-header">


<div class="brand">


<img src="logo.png">


<div>

<h2>
CABADBARAN PULLERS
</h2>

<span>
MERCH SALES SYSTEM
</span>


</div>


</div>



<a href="index.html">

<i class="fa-solid fa-arrow-left"></i>

Website

</a>


</header>





<main class="dashboard">



<h1>

<i class="fa-solid fa-chart-line"></i>

Sales Dashboard

</h1>





<section class="stats">


<div class="card">

<i class="fa-solid fa-shirt"></i>

<div>

<h2 id="totalSold">
0
</h2>

<p>
Jerseys Sold
</p>

</div>

</div>





<div class="card">

<i class="fa-solid fa-peso-sign"></i>

<div>

<h2 id="totalSales">
₱0
</h2>

<p>
Total Sales
</p>

</div>

</div>






<div class="card">

<i class="fa-solid fa-coins"></i>

<div>

<h2 id="totalProfit">
₱0
</h2>

<p>
Gross Profit
</p>

</div>

</div>






<div class="card">

<i class="fa-solid fa-wallet"></i>

<div>

<h2 id="ownerIncome">
₱0
</h2>

<p>
Owner Income
</p>

</div>

</div>


</section>








<section class="panel">


<h2>
<i class="fa-solid fa-cart-plus"></i>
Add New Sale
</h2>




<form id="saleForm">



<label>
Buyer Name
</label>

<input 
id="buyer"
required
placeholder="Customer name">





<label>
Contact Number
</label>

<input 
id="contact"
placeholder="Phone number">






<label>
Product
</label>


<select id="product">


<option>
Official Jersey Frontier
</option>


<option>
Official Jersey Golden Rev Frontier
</option>


<option>
Official Jersey Black Noir
</option>


<option>
Competition HighAce Edition
</option>


<option>
Premium Cabadbaranon Edition
</option>


<option>
Golden Haven CP Edition
</option>


<option>
Royal Void CP Edition
</option>


<option>
Classic RS Development Edition
</option>


<option>
Limited Midnight Fury RS Development Edition
</option>


</select>







<div class="two">


<div>

<label>
Quantity
</label>

<input 
type="number"
id="quantity"
value="1"
min="1">

</div>





<div>

<label>
Seller
</label>

<input
id="seller"
placeholder="Seller name">


</div>


</div>







<label>
Commission
</label>


<select id="commission">


<option value="0">
Owner Sale (No Commission)
</option>


<option value="10">
10% Seller Commission
</option>


</select>







<label>
Payment Status
</label>


<select id="payment">


<option>
Paid
</option>


<option>
Pending
</option>


</select>






<button type="submit">


<i class="fa-solid fa-plus"></i>

Record Sale


</button>



</form>



</section>









<section class="panel">


<h2>

<i class="fa-solid fa-table"></i>

Sales Records

</h2>




<div class="table">


<table>


<thead>

<tr>

<th>Date</th>

<th>Buyer</th>

<th>Product</th>

<th>Qty</th>

<th>Seller</th>

<th>Sales</th>

<th>Profit</th>

<th>Commission</th>

<th>Income</th>


</tr>

</thead>



<tbody id="salesTable">


</tbody>


</table>


</div>


</section>






</main>




<script src="sales.js"></script>


</body>

</html>
